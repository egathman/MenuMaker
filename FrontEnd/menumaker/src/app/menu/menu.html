<div class="menu-style">
    <!-- Top Level Page for Week Selection -->
     <div class="horizontal-div">
        <button matIconButton aria-label="Example icon button with a vertical three dot icon">
            <mat-icon>chevron_left</mat-icon>
        </button>
        <div class="vertical-div">
            <div class="WeekText">Week of the 19th (July 19 - July 25)</div>            
        </div>
        <button matIconButton aria-label="Example icon button with a open in new tab icon">
            <mat-icon>chevron_right</mat-icon>
        </button>
     </div>

     <!-- Show the Current Monday through Friday options -->
    <div class="horizontal-div">
        <div class="menu-items">
            <menu-item class="menu-item" Day="Sunday"></menu-item>
            <menu-item class="menu-item" Day="Monday"></menu-item>
            <menu-item class="menu-item" Day="Tuesday"></menu-item>
            <menu-item class="menu-item" Day="Wednesday"></menu-item>
            <menu-item class="menu-item" Day="Thursday"></menu-item>
            <menu-item class="menu-item" Day="Friday"></menu-item>
            <menu-item class="menu-item" Day="Saturday"></menu-item>
        </div>
    </div>

     <!-- Give the Generation options -->
    <div class="horizontal-div">
        <button matButton="elevated">GENERATE NEW MENU</button>
    </div>
</div>
